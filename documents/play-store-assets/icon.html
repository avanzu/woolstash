<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 512px;
            height: 512px;
            margin: 0;
            overflow: hidden;
        }
        html {
            background: transparent;
        }
        body {
            background: transparent;
            display: grid;
            place-items: center;
        }
        .canvas {
            width: 512px;
            height: 512px;
            background: #2b1530;
            clip-path: polygon(
                0 0,
                100% 0,
                100% calc(100% - 1px),
                calc(100% - 1px) calc(100% - 1px),
                calc(100% - 1px) 100%,
                0 100%
            );
            display: grid;
            place-items: center;
        }
        img {
            width: 430px;
            height: 430px;
            object-fit: contain;
            filter: drop-shadow(0 18px 22px rgba(0, 0, 0, 0.28));
        }
    </style>
</head>
<body>
    <div class="canvas">
        <img src="../../app/src/main/res/drawable-nodpi/product_yarn.png" alt="">
    </div>
</body>
</html>
